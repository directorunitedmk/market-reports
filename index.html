  .kpi .value{font-size:22px;font-weight:800;letter-spacing:-.02em}
  .kpi .delta{font-size:11.5px;font-weight:600}
  .up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--warn)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);padding:7px 9px;border-bottom:2px solid var(--line);white-space:nowrap}
  td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
  .pill.good{background:var(--goodbg);color:var(--good)}
  .pill.warn{background:var(--warnbg);color:var(--warn)}
  .pill.bad{background:var(--badbg);color:var(--bad)}

  .bar i{display:block;height:100%;border-radius:99px}
  .name{font-weight:700}
  .mini{font-size:11.5px;color:var(--ink2)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}

  const gap=Math.max(0,a.actQ-a.mtd);
  if(a.act<95) out.push(`Market is pacing <b>${pct(a.act)}</b> to activation quota — ${gap.toLocaleString()} boxes still needed (~<b>${Math.ceil(gap/Math.max(1,daysLeft))}/day</b>). Every door needs a closing push before close tonight.`);
  if(zeroToday.length) out.push(`<b>No boxes on the board yet today</b> at the biggest-gap stores: ${zeroToday.map(r=>'<b>'+r[1]+'</b> ('+pct(r[4])+' to quota)').join(', ')}. Call these DMs/managers first.`);
  if(blitz.length) out.push(`Accessory push this afternoon at stores that close boxes but skip attach: ${blitz.map(r=>'<b>'+r[1]+'</b> ('+pct(r[7])+' acc quota)').join(', ')}.`);
  if(dark.length) out.push(`Zero production MTD at: ${dark.map(r=>'<b>'+r[1]+'</b>').join(', ')} — verify open/staffed today or reallocate quota.`);
  if(m.emps.zero.length) out.push(`Check in on ${m.emps.zero.map(e=>'<b>'+e[0]+'</b> ('+e[1]+' hrs, 0 boxes'+(e[2]?', '+e[2]+' payments':'')+')').join(', ')} — convert their floor time into sales today.`);
  if(m.emps.top.length) out.push(`Shout out <b>${m.emps.top[0][0]}</b> (${m.emps.top[0][2]} boxes, ${fmt$(m.emps.top[0][3])} accessory) on the market chat — set the tone for the afternoon.`);
  return out;
}

function render(name){
  const m=DATA[name], a=attain(m), c=document.getElementById('content');
  const momA=(m.mom.tot[1]-m.mom.tot[0])/m.mom.tot[0]*100, momC=(m.mom.acc[1]-m.mom.acc[0])/m.mom.acc[0]*100;
  const stores=[...m.stores].sort((x,y)=>y[4]-x[4]);
  let h='';
  // FOCUS
  h+='<div class="focus"><h2>⚡ Focus for the rest of today — '+name+'</h2><div class="desc">Generated '+GEN.date+' '+GEN.time+' · acts on the board today: '+Object.values(m.today).reduce((s,v)=>s+v,0)+'</div>';
  focusItems(name,m,a).forEach((f,i)=>{h+='<div class="fitem"><div class="fnum">'+(i+1)+'</div><div>'+f+'</div></div>'});
  h+='</div>';
  // KPIs
  h+='<div class="kpis">';
  h+=kpi('MTD Activations',a.mtd.toLocaleString(),(momA<0?'▼ ':'▲ ')+Math.abs(momA).toFixed(1)+'% vs May pace',momA<0?'down':'up');
  h+=kpi('Act. Attainment (proj)',pct(a.act),m.meta.proj.toLocaleString()+' proj vs '+a.actQ.toLocaleString()+' quota',a.act>=90?'up':(a.act>=70?'flat':'down'));
  h+=kpi('MTD Accessory',fmt$(a.mtdAcc),(momC<0?'▼ ':'▲ ')+Math.abs(momC).toFixed(1)+'% vs May pace',momC<0?'down':'up');
  h+=kpi('Acc. Attainment (proj)',pct(a.acc),fmt$(m.meta.accProj)+' proj vs '+fmt$(a.accQ)+' quota',a.acc>=90?'up':(a.acc>=70?'flat':'down'));
  h+=kpi('Acts / Door',m.meta.ppd,m.meta.doors+' producing doors','flat');
  h+=kpi('Qpay Conversion',m.meta.conv+'%','company avg 55.7%',m.meta.conv>=55.7?'up':'down');
  h+='</div>';
  // STORES
  h+='<div class="sect"><h2>Store scorecard</h2><div class="desc">MTD vs monthly quota, projected to month-end. Sorted by activation attainment.</div><table><tr><th>Store</th><th class="num">MTD</th><th class="num">Today</th><th class="num">Act. vs Quota</th><th style="width:13%"></th><th class="num">Acc. vs Quota</th><th class="num">APH (target)</th></tr>';
  stores.forEach(r=>{
    const dark=r[3]===0;
    h+='<tr><td class="name">'+r[1]+(dark?' <span class="pill bad">no production</span>':'')+'</td><td class="num">'+r[3]+'</td><td class="num">'+(m.today[r[0]]||0)+'</td><td class="num"><span class="pill '+cls(r[4])+'">'+pct(r[4])+'</span></td><td><div class="bar"><i class="'+barCls(r[4])+'" style="width:'+Math.min(100,r[4])+'%"></i></div></td><td class="num"><span class="pill '+cls(r[7])+'">'+pct(r[7])+'</span></td><td class="num">$'+r[9].toFixed(2)+' <span class="mini">($'+r[8].toFixed(0)+')</span></td></tr>';
  });
  h+='</table></div>';
  // EMPLOYEES
  h+='<div class="cols">';
  h+='<div class="sect"><h2>🏆 Recognize</h2><div class="desc">Market avgs: '+m.emps.avgBox+' boxes · '+fmt$(m.emps.avgAcc)+' accessory per rep (MTD)</div><table><tr><th>Employee</th><th class="num">Boxes</th><th class="num">Acc $</th><th class="num">Attach</th><th class="num">Payments</th></tr>';
  m.emps.top.forEach(e=>{h+='<tr><td class="name">'+e[0]+'</td><td class="num">'+e[2]+'</td><td class="num">'+fmt$(e[3])+'</td><td class="num"><span class="pill good">'+e[4]+'%</span></td><td class="num">'+e[5]+'</td></tr>'});
  h+='</table></div>';
  h+='<div class="sect"><h2>🎯 Train / coach</h2><div class="desc">Closing track = low boxes for hours worked · Attach track = boxes OK, accessories skipped</div>';
  if(m.emps.close.length){h+='<table><tr><th>Closing track</th><th class="num">Hrs</th><th class="num">Boxes</th><th class="num">Attach</th></tr>';m.emps.close.forEach(e=>{h+='<tr><td class="name">'+e[0]+'</td><td class="num">'+e[1]+'</td><td class="num">'+e[2]+'</td><td class="num">'+e[3]+'%</td></tr>'});h+='</table><br>'}
  if(m.emps.attach.length){h+='<table><tr><th>Attach track</th><th class="num">Boxes</th><th class="num">Attach</th><th class="num">Acc $</th></tr>';m.emps.attach.forEach(e=>{h+='<tr><td class="name">'+e[0]+'</td><td class="num">'+e[1]+'</td><td class="num"><span class="pill bad">'+e[2]+'%</span></td><td class="num">'+fmt$(e[3])+'</td></tr>'});h+='</table>'}
  if(!m.emps.close.length&&!m.emps.attach.length){h+='<div class="mini">No flagged coaching candidates this period.</div>'}
  h+='</div></div>';
  c.innerHTML=h;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.m===name));
}
function kpi(l,v,d,dir){return '<div class="kpi"><div class="label">'+l+'</div><div class="value">'+v+'</div><div class="delta '+dir+'">'+d+'</div></div>'}

document.getElementById('gensub').textContent='Generated '+GEN.date+' at '+GEN.time+' · RT BDI data refreshed '+GEN.refreshed+' · June 1–'+GEN.dayOfMonth+' MTD vs monthly quota';
const tabs=document.getElementById('tabs');
Object.keys(DATA).forEach(name=>{
  const a=attain(DATA[name]);
  const b=document.createElement('button');b.className='tab';b.dataset.m=name;
  b.innerHTML=name+' <span class="pct pill '+cls(a.act)+'">'+pct(a.act)+'</span>';
  b.onclick=()=>render(name);
  tabs.appendChild(b);
});
render('ALBUQUERQUE');
</script>
</body>
</html>
